[package]
name = "global_timer"
version = "0.1.0"
edition = "2021"
description = "A focused native desktop timer built with eframe and egui"
license = "MIT"

[dependencies]
eframe = "0.36.1"
global-hotkey = "0.8.0"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
accesskit = "0.24.1"
egui_kittest = { version = "0.36.1", features = ["eframe", "wgpu", "snapshot"] }
